name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create Release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MOD_VERSION=$(grep 'mod_version=' gradle.properties | cut -d'=' -f2)
          RELEASE_VERSION="${TAG#v}"
          if [ "$MOD_VERSION" != "$RELEASE_VERSION" ]; then
            echo "ERROR: tag v$RELEASE_VERSION does not match mod_version=$MOD_VERSION in gradle.properties"
            exit 1
          fi
          JAR=$(ls build/libs/crowbuddy-${MOD_VERSION}.jar | grep -v sources)
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            "$JAR"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
